name: Bounty commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  command:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type == 'User' &&
      (contains(fromJSON('["/claim","/release","/open","/unblock","/approve"]'), github.event.comment.body) ||
       startsWith(github.event.comment.body, '/progress ') ||
       startsWith(github.event.comment.body, '/submit ') ||
       startsWith(github.event.comment.body, '/changes ') ||
       github.event.comment.body == '/block' || startsWith(github.event.comment.body, '/block '))
    concurrency:
      group: bounty-state-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/bounty_commands.js`);
            await run({ github, context });
