name: Miner / intelligence-supply gap
description: Report missing, weak or insufficiently competitive supply for an Intent.
title: "[Miner] "
labels: ["work:miner", "gap:supply", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        This Issue is public. Use authorized, sanitized reproduction evidence and keep customer or Anjoman jobs, user files, private request IDs, secrets, budgets, internal evaluations, hidden test answers, precise evaluator weaknesses and exploitable infrastructure details in the appropriate private system.
  - type: input
    id: intent
    attributes:
      label: Intent
      description: Use the canonical Intent name if one already exists.
      placeholder: e.g. WEATHER_FORECAST_VERIFY
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: What real demand is blocked or degraded?
      description: Describe the approved public outcome or broad need. Name a customer or private job only with documented permission.
      placeholder: "Resources & Agriculture app cannot complete because..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Provide public evidence. Share private request IDs, internal ranking diagnostics and detailed evaluator failure patterns through the authorized private channel.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What observable result would close the gap?
      description: State the public observable outcome. Sensitive acceptance tests are reviewed privately.
    validations:
      required: true
