name: Evaluation contribution opportunity (public / nonsensitive)
description: Propose public, Category-level evaluation material or methodology.
title: "[Evaluation] "
labels: ["work:evaluator", "gap:evaluation", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        This form creates a public Issue. Describe the Category and general contribution here; share affected Intent IDs, detailed coverage metrics, private evidence URLs, hidden samples, reference answers, qualification thresholds, personal or customer data, and exploit details through the private channel in SECURITY.md.
  - type: input
    id: category
    attributes:
      label: Public Category
      description: Identify the broadly supported Category for this contribution.
      placeholder: e.g. weather-intelligence
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Public contribution proposal
      description: Describe a public contribution such as reference material, methodology or a compatible evaluation approach.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Nonsensitive proof or examples
      description: Add published documentation or a generic example. Use the private security channel for sensitive details.
    validations:
      required: false
  - type: textarea
    id: public_acceptance
    attributes:
      label: Public acceptance outline
      description: State public, general outcomes. Maintainers confirm sensitive criteria through an authorized review before opening a claimable bounty.
    validations:
      required: true
