name: Evaluator development opportunity (public / nonsensitive)
description: Suggest reusable evaluation work for a broad public Category.
title: "[Evaluator] "
labels: ["work:evaluator", "gap:evaluation", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        This form creates a public Issue. Describe the Category and general improvement here; report exploitable blind spots, stale tests, source concentration, hidden cases, per-Intent weaknesses, credentials and customer data through the private channel in SECURITY.md.
  - type: input
    id: category
    attributes:
      label: Public Category
      description: Name the reusable task family for this proposal.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested general improvement
      description: Describe a public evaluation methodology, independent verification tool or Category-compatible adapter improvement.
    validations:
      required: true
  - type: textarea
    id: public_acceptance
    attributes:
      label: Safe public acceptance outline
      description: Describe general reproducible outcomes. Maintainers agree on sensitive targets and validation details privately.
    validations:
      required: true
