name: Scoring module gap
description: An Intent family needs a better evaluator adapter, or scores answers badly.
title: "[Evaluator] "
labels: ["work:evaluator", "gap:evaluation", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        An adapter is registered on an Intent **family** (the parent prefix, `GAS_PRICE` not `GAS_PRICE_GENERAL`), never on one Intent, and the family's own kind decides whether it takes one. Every Intent has the same kind as its family.

        **Check the family's kind in [the catalogue](https://github.com/telegraphprotocol/bounties/blob/main/docs/INTENTS.md) before you report or build.** A judgment or hybrid family takes an evaluator adapter, and a better one can replace the one in place. A deterministic family takes **no adapter**: the node's built-in checker scores it, and comparator modules are no longer accepted. Do not open a gap for one.

        Keep the qualification material the network holds back, private diagnostics and exploit details out of this form; send those through the channel in [SECURITY.md](https://github.com/telegraphprotocol/bounties/blob/main/SECURITY.md).
  - type: input
    id: family
    attributes:
      label: Family
      description: The family a module would be registered on, and its kind as the catalogue gives it.
      placeholder: e.g. CODE_REVIEW (judgment)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What the module should do better
      description: What the current scoring gets wrong, and what yours would do instead. Name the Intents under the family that it would serve.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would close it
      description: The observable result, normally "a module is live on this family and scores its Intents". The network decides that on its own checks, so say what you would show a maintainer.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Check
      options:
        - label: I have checked the family's kind in the catalogue, and a module of that kind can serve the Intents I named.
          required: true
        - label: This Issue discloses no secret, private key, customer data or exploitable weakness.
          required: true
