name: App / Agent integration gap
description: Report something preventing a real App or Agent from using Telegraph end-to-end.
title: "[App] "
labels: ["work:app", "gap:integration", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        This Issue is public. Use authorized, sanitized reproduction evidence and keep customer or Anjoman jobs, user files, private request IDs, secrets, budgets, internal evaluations, hidden test answers, precise evaluator weaknesses and exploitable infrastructure details in the appropriate private system.
  - type: input
    id: app
    attributes:
      label: App / mission / integration
      placeholder: e.g. Season II — Consumer Automation
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What is supposed to work?
      description: Describe the end-to-end outcome and the technical symptom.
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: What blocks it?
      description: Describe the reusable blocker broadly. Share sensitive routing, evaluation or security diagnostics through the private reporting channel.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public-safe evidence / reproduction
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What observable result would make the App unblocked?
    validations:
      required: true
