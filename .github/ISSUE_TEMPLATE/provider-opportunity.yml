name: Independent Provider recruitment opportunity
# This form is for commercial Provider recruitment.
description: Suggest onboarding an existing commercial machine-callable service for verified demand.
title: "[Provider opportunity] "
labels: ["work:miner", "opportunity:provider", "status:triage", "reward:unfunded"]
body:
  - type: markdown
    attributes:
      value: |
        This is a public recruitment lead for an established service and uses the commercial onboarding path. Keep private buyers, budgets, API credentials, contracts, hidden evaluation weaknesses and live request payloads in their authorized systems. A maintainer confirms eligibility and buyer demand before changing status.
  - type: input
    id: capability
    attributes:
      label: Service type or existing Intent
      description: State the broad task and any known public Intent. Propose a new Intent only when the task itself is a reusable intelligence primitive.
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: Why existing supply may be useful
      description: Cite a publicly verifiable market gap or broad use case. State customer, funding and ranking claims only when independently verified.
    validations:
      required: true
  - type: textarea
    id: availability
    attributes:
      label: Public integration information
      description: Link public endpoint documentation, access terms, data formats and conditions. Send credentials through an approved private channel.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: What would count as a usable onboarding?
      description: At a general level, demonstrate approved service connectivity, valid Intent fit, eligibility and a working example. Evaluation determines ranking independently.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Disclosure check
      options:
        - label: This proposal contains only publicly shareable information and does not promise payment, buyer demand or ranking.
          required: true
